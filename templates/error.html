<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error {{ code }} - DAIS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div style="display:flex;justify-content:center;align-items:center;min-height:100vh;background:var(--bg);">
        <div style="text-align:center;">
            <h1 style="font-size:4rem;color:var(--primary);">{{ code }}</h1>
            <p style="font-size:1.1rem;color:var(--text-light);">{{ message }}</p>
            <div style="margin-top:20px;">
                {% if current_user.is_authenticated %}
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Ir al Dashboard</a>
                {% else %}
                <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Iniciar Sesion</a>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
